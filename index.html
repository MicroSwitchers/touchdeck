<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Primary Meta -->
    <meta name="description" content="A privacy-first AAC communication app. Tap large buttons to speak words and phrases.">
    <meta name="author" content="TouchTab">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- PWA / Standalone Mode -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-title" content="TouchTab">
    <meta name="application-name" content="TouchTab">
    <meta name="msapplication-TileColor" content="#09090b">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon.svg">

    <!-- Open Graph (for link sharing) -->
    <meta property="og:title" content="TouchTab – Tap to Words">
    <meta property="og:description" content="A privacy-first AAC communication app for tablets.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="icons/icon.svg">

    <title>Tap to Words</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #09090b; /* zinc-950 */
            overscroll-behavior: none;
        }

        /* ── Canvas ambient gradient ──────────────────────────────────────── */
        #main-canvas {
            background:
                radial-gradient(ellipse 70% 60% at 15% 40%, rgba(99,102,241,0.10) 0%, transparent 100%),
                radial-gradient(ellipse 55% 45% at 85% 25%, rgba(168,85,247,0.07) 0%, transparent 100%),
                radial-gradient(ellipse 50% 55% at 65% 85%, rgba(59,130,246,0.06) 0%, transparent 100%);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #818cf8; }

        @keyframes bounce-custom {
            0%, 100% { transform: translateY(-30%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }
        .animate-bounce-custom { animation: bounce-custom 0.85s infinite; }

        @keyframes pulse-record {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .recording-pulse { animation: pulse-record 1.5s infinite ease-in-out; }

        /* ── Slider styling ───────────────────────────────────────────────── */
        input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            height: 18px; width: 18px; border-radius: 50%;
            background: #ffffff; cursor: pointer; margin-top: -6px;
            box-shadow: 0 0 0 3px #6366f1, 0 2px 8px rgba(99,102,241,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; cursor: pointer;
            background: linear-gradient(to right, #6366f1, #a855f7);
            border-radius: 3px;
        }

        /* ── iOS / iPadOS fixes ──────────────────────────────────────────── */
        html { height: 100%; }
        html, body { min-height: -webkit-fill-available; }

        /* Safe-area insets: keep gear button clear of notch / Dynamic Island */
        #header {
            padding-top:   max(1.5rem, env(safe-area-inset-top,   1.5rem));
            padding-right: max(1.5rem, env(safe-area-inset-right, 1.5rem));
        }
        /* Keep positioning-mode bottom buttons above the home indicator */
        #pos-overlay-footer {
            padding-bottom: max(2rem, env(safe-area-inset-bottom, 2rem));
        }

        /* Allow finger-scrolling inside the settings panel. */
        #settings-content {
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            overflow-y: scroll;
        }

        /* Vendor-prefixed backdrop-filter for iOS 12-14 */
        #settings-backdrop { -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px); }
        #confirm-modal     { -webkit-backdrop-filter: blur(6px);  backdrop-filter: blur(6px);  }

        /* Remove grey flash on tap and suppress native long-press callout */
        button, [role="button"] {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        /* ── Button entrance animation ───────────────────────────────────── */
        @keyframes btn-enter {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.72); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(var(--btn-scale, 1)); }
        }
        .btn-enter { animation: btn-enter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        /* ── Physical button depth ────────────────────────────────────────── */
        .app-button {
            box-shadow:
                /* Cast shadow (button elevated above canvas) */
                0 28px 55px -8px  rgba(0,0,0,0.75),
                0 12px 24px -6px  rgba(0,0,0,0.55),
                0  4px  8px -2px  rgba(0,0,0,0.40),
                /* Lit top rim (light from above) */
                inset 0  3px  6px rgba(255,255,255,0.28),
                /* Dark bottom inner (adds cylinder depth) */
                inset 0 -5px 14px rgba(0,0,0,0.30);
            transition: box-shadow 0.08s ease;
        }

        /* ── Speaking border (simple, visible indicator) ───────────────────── */
        .speaking-border {
            outline: 4px solid var(--speaking-color, rgba(255,255,255,0.9));
            outline-offset: 3px;
        }

        /* ── Range input accent ───────────────────────────────────────────── */
        input[type=range] { accent-color: #6366f1; }

        /* ── Hint toast ───────────────────────────────────────────────────── */
        #start-hint {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* ── Settings section card ────────────────────────────────────────── */
        .sys-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 0.875rem;
            padding: 1rem;
        }

        /* ── Settings modal gradient accent strip ─────────────────────────── */
        #settings-accent-strip {
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
            border-radius: 1.5rem 1.5rem 0 0;
        }

        /* ── Scanning mode highlight ──────────────────────────────────────── */
        /* --scan-color / --scan-glow are set per-button in updateScanHighlight */
        @keyframes scan-pulse {
            0%, 100% {
                box-shadow:
                    0 0 0 4px transparent,
                    0 0 0 9px var(--scan-color, rgba(250,204,21,0.9)),
                    0 0 40px var(--scan-glow,  rgba(250,204,21,0.4)),
                    0 28px 55px -8px rgba(0,0,0,0.75),
                    inset 0  3px  6px rgba(255,255,255,0.28),
                    inset 0 -5px 14px rgba(0,0,0,0.30);
            }
            50% {
                box-shadow:
                    0 0 0 4px transparent,
                    0 0 0 12px var(--scan-color, rgba(250,204,21,1.0)),
                    0 0 60px var(--scan-glow,  rgba(250,204,21,0.6)),
                    0 28px 55px -8px rgba(0,0,0,0.75),
                    inset 0  3px  6px rgba(255,255,255,0.28),
                    inset 0 -5px 14px rgba(0,0,0,0.30);
            }
        }
        .scan-highlight { animation: scan-pulse 0.7s ease-in-out infinite !important; }

        /* ── Output display bar ───────────────────────────────────────────── */
        #output-bar { transition: opacity 0.4s ease; }
        #output-bar.hiding { opacity: 0 !important; }
    </style>
</head>
<body class="text-white h-screen w-screen flex flex-col overflow-hidden bg-zinc-950">

    <!-- App Container -->
    <div id="app-container" class="relative w-full h-full flex flex-col transition-transform duration-300 ease-out">
        
        <!-- Header -->
        <header id="header" class="absolute top-0 left-0 w-full p-6 flex justify-end items-center z-40 pointer-events-none transition-opacity duration-300">
            <div class="relative pointer-events-auto group">
                <button id="settings-trigger" class="relative p-4 rounded-full transition-all duration-500 ease-out bg-transparent hover:bg-zinc-800/50 header-rotate">
                    <i data-lucide="settings" id="settings-icon" class="w-6 h-6 text-zinc-600 group-hover:text-zinc-400 transition-colors duration-300"></i>
                    <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none p-1">
                        <circle cx="50%" cy="50%" r="20" fill="none" stroke="currentColor" stroke-width="3" class="text-zinc-800"></circle>
                        <circle id="hold-progress-ring" cx="50%" cy="50%" r="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="125.6" stroke-dashoffset="125.6" class="text-indigo-500 transition-all duration-75"></circle>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Positioning Overlay -->
        <div id="positioning-overlay" class="absolute inset-0 z-30 pointer-events-none hidden transition-transform duration-300">
            <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.05)_1px,transparent_1px)] bg-[size:40px_40px] [mask-image:radial-gradient(ellipse_80%_80%_at_50%_50%,black,transparent)]"></div>
            <div class="absolute top-8 left-0 w-full flex justify-center">
                <div class="text-white px-6 py-3 rounded-full font-bold shadow-2xl flex items-center gap-3 animate-in fade-in slide-in-from-top-4 duration-500" style="background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 8px 32px rgba(99,102,241,0.45)">
                    <i data-lucide="move" class="w-5 h-5 animate-pulse"></i>
                    <span>Auto Arrange • Drag to Move • Pinch / Scroll to Resize</span>
                </div>
            </div>
            <div class="absolute top-24 right-8 pointer-events-auto">
                <button id="toggle-output-bar-btn" class="text-white px-4 py-3 rounded-xl font-semibold text-sm shadow-lg flex items-center gap-2 transition-all hover:brightness-110" style="background:rgba(139,92,246,0.12);border:1px solid rgba(139,92,246,0.35);backdrop-filter:blur(8px)">
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                    <span id="output-bar-toggle-label">Voice Readout: On</span>
                </button>
            </div>
            <div id="pos-overlay-footer" class="absolute bottom-0 left-0 w-full flex justify-center gap-4 pointer-events-auto pb-8">
                <button id="auto-arrange-btn" class="text-white px-6 py-4 rounded-2xl font-bold shadow-lg flex items-center gap-2 transition-all hover:brightness-110" style="background:rgba(16,185,129,0.12);border:1px solid rgba(52,211,153,0.35);backdrop-filter:blur(8px)">
                    <i data-lucide="grid-3x3" class="w-5 h-5"></i> Auto Arrange
                </button>
                <button id="reset-pos-btn" class="text-white px-6 py-4 rounded-2xl font-bold shadow-lg flex items-center gap-2 transition-all hover:brightness-110" style="background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.18);backdrop-filter:blur(8px)">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i> Reset
                </button>
                <button id="lock-pos-btn" class="text-white px-8 py-4 rounded-2xl font-bold shadow-lg flex items-center gap-2 transition-all hover:brightness-110" style="background:linear-gradient(135deg,#059669,#047857);box-shadow:0 8px 24px rgba(5,150,105,0.4)">
                    <i data-lucide="lock" class="w-5 h-5"></i> Lock Positions
                </button>
            </div>
        </div>

        <!-- Main Canvas -->
        <main id="main-canvas" class="flex-1 relative w-full h-full overflow-hidden z-10 touch-none">
            <!-- Buttons injected here -->
        </main>

        <!-- Scan mode overlay: sits above canvas, captures all input when scanning is active -->
        <div id="scan-overlay" class="absolute inset-0 hidden cursor-pointer" style="z-index:25;touch-action:none"></div>

        <!-- Output Display Bar: shows the phrase that was just spoken -->
        <div id="output-bar" class="absolute z-40 pointer-events-none" style="opacity:0;left:50%;top:92%;transform:translate(-50%,-50%) scale(1)">
            <div class="px-8 py-4 rounded-2xl text-center" style="background:rgba(0,0,0,0.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.15);box-shadow:0 8px 40px rgba(0,0,0,0.55);max-width:min(480px,88vw)">
                <span id="output-text" class="text-2xl font-bold text-white leading-snug"></span>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 hidden">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-xl transition-opacity" id="settings-backdrop"></div>
        <div class="relative w-full max-w-2xl bg-[#0d0d12] border border-white/10 rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[95vh] sm:max-h-[85vh] animate-in fade-in zoom-in-95 duration-200">
            <!-- Gradient accent strip -->
            <div id="settings-accent-strip"></div>
            <div class="bg-[#0d0d12] border-b border-white/8 shrink-0">
                <div class="flex justify-between items-center p-5">
                    <div class="flex items-center gap-3">
                        <div class="p-2 rounded-xl" style="background:linear-gradient(135deg,rgba(99,102,241,0.25),rgba(168,85,247,0.15));border:1px solid rgba(99,102,241,0.3)">
                            <i data-lucide="settings" class="w-5 h-5 text-indigo-300"></i>
                        </div>
                        <h2 class="text-xl font-black tracking-tight" style="background:linear-gradient(90deg,#fff,#a1a1aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Settings</h2>
                    </div>
                    <button id="close-settings-top" class="p-2 rounded-full text-zinc-400 hover:text-white hover:bg-white/10 transition-all"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
                <div class="flex px-5 gap-1">
                    <button id="tab-buttons" class="flex-1 py-3 text-sm font-black uppercase tracking-wide border-b-2 transition-all border-indigo-400 text-white">Buttons</button>
                    <button id="tab-system" class="flex-1 py-3 text-sm font-black uppercase tracking-wide border-b-2 transition-all border-transparent text-zinc-500 hover:text-zinc-300">System</button>
                </div>
            </div>
            <div id="settings-content" class="p-4 sm:p-6 overflow-y-auto custom-scrollbar flex-1"></div>
            <div class="p-4 border-t border-white/8 bg-[#0d0d12] shrink-0">
                <button id="close-settings-btn" class="w-full py-4 text-white font-black rounded-xl transition-all active:scale-[0.98] active:brightness-90" style="background:linear-gradient(135deg,#4f46e5,#7c3aed,#9333ea);box-shadow:0 8px 32px rgba(99,102,241,0.35)">Done</button>
            </div>
        </div>
    </div>

    <!-- Dynamic Confirm Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden animate-in fade-in duration-200">
        <div class="bg-[#0d0d12] border border-white/10 rounded-2xl p-6 max-w-sm w-full shadow-2xl scale-100">
            <div class="flex items-center gap-3 mb-4">
                <div class="p-2 rounded-xl bg-red-500/15 border border-red-500/25">
                    <i data-lucide="alert-triangle" class="w-5 h-5 text-red-400"></i>
                </div>
                <h3 id="confirm-title" class="text-lg font-black text-white">Confirm Action</h3>
            </div>
            <p id="confirm-desc" class="text-zinc-400 text-sm mb-6 leading-relaxed">Are you sure?</p>
            <div class="flex gap-3">
                <button id="btn-cancel-confirm" class="flex-1 py-3 rounded-xl font-bold text-zinc-400 hover:text-white hover:bg-white/8 transition-colors border border-white/10">Cancel</button>
                <button id="btn-do-confirm" class="flex-1 py-3 rounded-xl font-bold text-white transition-colors shadow-lg shadow-red-900/30" style="background:linear-gradient(135deg,#dc2626,#991b1b)">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONSTANTS ---
        const COLORS = [
            { name: 'Red',    bg: 'bg-red-500',     active: 'active:bg-red-700',     shadow: 'border-red-700',     text: 'text-white' },
            { name: 'Blue',   bg: 'bg-blue-500',    active: 'active:bg-blue-700',    shadow: 'border-blue-700',    text: 'text-white' },
            { name: 'Green',  bg: 'bg-emerald-500', active: 'active:bg-emerald-700', shadow: 'border-emerald-700', text: 'text-white' },
            { name: 'Yellow', bg: 'bg-yellow-400',  active: 'active:bg-yellow-600',  shadow: 'border-yellow-600',  text: 'text-black' },
            { name: 'Orange', bg: 'bg-orange-500',  active: 'active:bg-orange-700',  shadow: 'border-orange-700',  text: 'text-white' },
            { name: 'Purple', bg: 'bg-purple-500',  active: 'active:bg-purple-700',  shadow: 'border-purple-700',  text: 'text-white' },
            { name: 'Pink',   bg: 'bg-pink-500',    active: 'active:bg-pink-700',    shadow: 'border-pink-700',    text: 'text-white' },
            { name: 'Gray',   bg: 'bg-zinc-500',    active: 'active:bg-zinc-700',    shadow: 'border-zinc-700',    text: 'text-white' },
        ];

        const GLOW_COLORS = {
            'Red':    'rgba(239,68,68,0.65)',
            'Blue':   'rgba(59,130,246,0.65)',
            'Green':  'rgba(16,185,129,0.65)',
            'Yellow': 'rgba(234,179,8,0.65)',
            'Orange': 'rgba(249,115,22,0.65)',
            'Purple': 'rgba(168,85,247,0.65)',
            'Pink':   'rgba(236,72,153,0.65)',
            'Gray':   'rgba(113,113,122,0.65)',
        };

        // Scan outline colours: ring = solid border, glow = diffuse outer halo
        const SCAN_COLORS = {
            'Yellow': { ring: 'rgba(250,204,21,0.95)', glow: 'rgba(250,204,21,0.45)', swatch: '#facc15' },
            'White':  { ring: 'rgba(255,255,255,0.95)', glow: 'rgba(255,255,255,0.35)', swatch: '#ffffff' },
            'Red':    { ring: 'rgba(239,68,68,0.95)',   glow: 'rgba(239,68,68,0.45)',   swatch: '#ef4444' },
            'Blue':   { ring: 'rgba(59,130,246,0.95)',  glow: 'rgba(59,130,246,0.45)',  swatch: '#3b82f6' },
            'Green':  { ring: 'rgba(16,185,129,0.95)',  glow: 'rgba(16,185,129,0.45)',  swatch: '#10b981' },
            'Orange': { ring: 'rgba(249,115,22,0.95)',  glow: 'rgba(249,115,22,0.45)',  swatch: '#f97316' },
            'Purple': { ring: 'rgba(168,85,247,0.95)',  glow: 'rgba(168,85,247,0.45)',  swatch: '#a855f7' },
            'Pink':   { ring: 'rgba(236,72,153,0.95)',  glow: 'rgba(236,72,153,0.45)',  swatch: '#ec4899' },
        };

        const GRADIENTS = {
            'Red':    'linear-gradient(175deg, #fca5a5 0%, #ef4444 42%, #991b1b 100%)',
            'Blue':   'linear-gradient(175deg, #93c5fd 0%, #3b82f6 42%, #1e3a8a 100%)',
            'Green':  'linear-gradient(175deg, #6ee7b7 0%, #10b981 42%, #064e3b 100%)',
            'Yellow': 'linear-gradient(175deg, #fef08a 0%, #eab308 42%, #713f12 100%)',
            'Orange': 'linear-gradient(175deg, #fdba74 0%, #f97316 42%, #7c2d12 100%)',
            'Purple': 'linear-gradient(175deg, #d8b4fe 0%, #a855f7 42%, #4c1d95 100%)',
            'Pink':   'linear-gradient(175deg, #f9a8d4 0%, #ec4899 42%, #831843 100%)',
            'Gray':   'linear-gradient(175deg, #d4d4d8 0%, #71717a 42%, #18181b 100%)',
        };

        const ORIENTATIONS = [
            { id: 'auto', label: 'Auto', rotate: 0 },
            { id: '0', label: '0°', rotate: 0 },
            { id: '90', label: '90°', rotate: 90 },
            { id: '180', label: '180°', rotate: 180 },
            { id: '270', label: '270°', rotate: 270 },
        ];

        // --- STATE & HELPERS ---
        const state = {
            buttons: [],
            labelPos: 'on',
            selectedVoiceURI: '',
            hapticsEnabled: true,
            audioCueEnabled: true,
            activationMode: 'press',
            touchTarget: 'button', 
            orientationMode: 'auto',
            debounceTime: 0,
            showSettings: false,
            settingsTab: 'buttons',
            isPositioningMode: false,
            isSpeaking: false,
            activeButtonId: null,
            playingButtonId: null, 
            editingBtnId: null,
            voices: [],
            inDebounce: false,
            mediaRecorder: null,
            isRecording: false,
            playbackGain: 3.0,
            scanInterval: 2.0,
            scanColor: 'Yellow',
            scanTick: false,
            scanAnnounce: false,
            scanClearDebounce: false,
            outputBarPos: { x: 50, y: 92 },
            outputBarScale: 1.0,
            showOutputBarInPositioning: true
        };

        const createDefaultButton = (idOverride) => ({
            id: idOverride || Date.now().toString(),
            label: '',
            phrases: ["", "", ""],
            hasAudio: [false, false, false], 
            color: COLORS[1],
            pos: { x: 50, y: 50 },
            scale: 1.0,
            phraseIndex: 0
        });

        // --- STORAGE ---
        function safeGetItem(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
        function safeSetItem(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

        // --- DB ---
        const DB_NAME = 't2w_audio_db';
        const STORE_NAME = 'recordings';
        let dbInstance = null;
        
        function getDB() {
            return new Promise((resolve) => {
                if (typeof indexedDB === 'undefined') return resolve(null);
                if (dbInstance) return resolve(dbInstance);
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => e.target.result.createObjectStore(STORE_NAME);
                req.onsuccess = () => { dbInstance = req.result; resolve(dbInstance); };
                req.onerror = () => resolve(null);
            });
        }
        async function saveAudioBlob(key, blob) {
            const db = await getDB();
            if (!db) return false;
            try {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(blob, key);
                return new Promise(r => { tx.oncomplete = r; tx.onerror = () => r(false); });
            } catch(e) { return false; }
        }
        async function getAudioBlob(key) {
            const db = await getDB();
            if (!db) return null;
            try {
                return new Promise(r => {
                    const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(key);
                    req.onsuccess = () => r(req.result);
                    req.onerror = () => r(null);
                });
            } catch(e) { return null; }
        }
        async function deleteAudioBlob(key) {
            const db = await getDB();
            if (!db) return;
            try {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(key);
                return new Promise(r => { tx.oncomplete = r; });
            } catch(e) {}
        }
        async function clearAllAudioData() {
            const db = await getDB();
            if (!db) return;
            try {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).clear();
                return new Promise(r => { tx.oncomplete = r; });
            } catch(e) {}
        }
        async function getStorageSize() {
            const db = await getDB();
            if(!db) return 0;
            return new Promise(resolve => {
                let size = 0;
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.openCursor();
                req.onsuccess = (e) => {
                    const cursor = e.target.result;
                    if(cursor) {
                        if(cursor.value && cursor.value.size) size += cursor.value.size;
                        cursor.continue();
                    } else {
                        resolve(size);
                    }
                };
                req.onerror = () => resolve(0);
            });
        }
        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        // --- CROSS-PLATFORM HELPERS ---
        function escHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        // Detect the best supported recording MIME type for the current browser/platform.
        // Prioritises opus-in-webm (Chrome/Firefox/Android), falls back to mp4 (iOS/Safari).
        function getSupportedMimeType() {
            if (typeof MediaRecorder === 'undefined') return '';
            const types = [
                'audio/webm;codecs=opus',
                'audio/webm',
                'audio/ogg;codecs=opus',
                'audio/ogg',
                'audio/mp4;codecs=mp4a.40.2',
                'audio/mp4',
            ];
            for (const t of types) {
                try { if (MediaRecorder.isTypeSupported(t)) return t; } catch(e) {}
            }
            return '';
        }

        // --- AUDIO CONTEXT (OPTIMIZED) ---
        let audioCtx = null;
        function initAudioCtx() {
            if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // blob.arrayBuffer() polyfill for iOS <= 14.4 which lacks the method.
        function blobToArrayBuffer(blob) {
            if (typeof blob.arrayBuffer === 'function') return blob.arrayBuffer();
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(blob);
            });
        }

        // iOS-safe audio playback via AudioContext + AudioBufferSourceNode.
        // HTMLAudioElement.play() fails after any await because iOS revokes the
        // user-gesture requirement. AudioBufferSourceNode.start() works fine
        // once the AudioContext is in a running state (unlocked synchronously
        // earlier in the same event handler via initAudioCtx()).
        async function createAndPlayAudio(blob, { onEnded, onError } = {}) {
            try {
                const ctx = initAudioCtx();
                if (!ctx) throw new Error('No AudioContext available');
                const arrayBuffer = await blobToArrayBuffer(blob);
                const audioBuffer = await new Promise((resolve, reject) => {
                    ctx.decodeAudioData(arrayBuffer, resolve, reject);
                });
                const source = ctx.createBufferSource();
                source.buffer = audioBuffer;
                // Amplify quiet recordings and soft-limit peaks to prevent distortion
                const gainNode = ctx.createGain();
                gainNode.gain.value = state.playbackGain || 3.0;
                const compressor = ctx.createDynamicsCompressor();
                compressor.threshold.value = -6;
                compressor.knee.value = 3;
                compressor.ratio.value = 4;
                compressor.attack.value = 0.005;
                compressor.release.value = 0.1;
                source.connect(gainNode);
                gainNode.connect(compressor);
                compressor.connect(ctx.destination);
                source.onended = () => onEnded && onEnded();
                source.start(0);
                return source; // caller can .stop() to interrupt early
            } catch (err) {
                onError && onError(err);
                return null;
            }
        }

        // --- CORE LOGIC ---
        function loadState() {
            try {
                // Button State
                const savedBtns = safeGetItem('t2w_buttons_v4');
                let loaded = savedBtns ? JSON.parse(savedBtns) : null;
                if (Array.isArray(loaded) && loaded.length > 0) {
                    state.buttons = loaded.map(b => {
                        if (!b || typeof b !== 'object') return createDefaultButton();
                        let color = COLORS[1];
                        if (b.color && b.color.bg) {
                             const found = COLORS.find(c => c.name === b.color.name);
                             color = found || b.color; 
                        }
                        return {
                            id: b.id || Math.random().toString(),
                            label: (typeof b.label === 'string') ? b.label : '',
                            phrases: Array.isArray(b.phrases) ? b.phrases : ["", "", ""],
                            hasAudio: Array.isArray(b.hasAudio) ? b.hasAudio : [false, false, false],
                            color: color,
                            pos: { x: Number(b.pos?.x) || 50, y: Number(b.pos?.y) || 50 },
                            scale: Number(b.scale) || 1.0,
                            phraseIndex: Number(b.phraseIndex) || 0
                        };
                    });
                } else {
                    state.buttons = [createDefaultButton()];
                }
                
                // Config State
                state.labelPos = safeGetItem('t2w_label_pos') || 'on';
                state.selectedVoiceURI = safeGetItem('t2w_voice') || "";
                state.hapticsEnabled = safeGetItem('t2w_haptics') !== 'false';
                state.audioCueEnabled = safeGetItem('t2w_audio') !== 'false';
                state.activationMode = safeGetItem('t2w_mode') || 'press';
                
                state.touchTarget = safeGetItem('t2w_target') || 'button';
                if (state.buttons.length > 1) state.touchTarget = 'button';

                state.debounceTime = Number(safeGetItem('t2w_debounce')) || 0;
                state.orientationMode = safeGetItem('t2w_orientation') || 'auto';
                state.playbackGain = Number(safeGetItem('t2w_gain')) || 3.0;
                state.scanInterval = Number(safeGetItem('t2w_scan_interval')) || 2.0;
                state.scanColor = safeGetItem('t2w_scan_color') || 'Yellow';
                state.scanTick = safeGetItem('t2w_scan_tick') === 'true';
                state.scanAnnounce = safeGetItem('t2w_scan_announce') === 'true';
                state.scanClearDebounce = safeGetItem('t2w_scan_clear_debounce') === 'true';
                
                const savedOutputBarPos = safeGetItem('t2w_output_bar_pos');
                if (savedOutputBarPos) {
                    try { state.outputBarPos = JSON.parse(savedOutputBarPos); } catch(e) {}
                }
                state.outputBarScale = Number(safeGetItem('t2w_output_bar_scale')) || 1.0;
                state.showOutputBarInPositioning = safeGetItem('t2w_show_output_bar_positioning') !== 'false';

                // Safety: Scan mode requires 2+ buttons
                if (state.buttons.length === 1 && state.activationMode === 'scan') {
                    state.activationMode = 'press';
                }

                // UI Persistence (Drawer State)
                const uiState = JSON.parse(safeGetItem('t2w_ui_state') || '{}');
                state.showSettings = !!uiState.showSettings;
                state.settingsTab = uiState.settingsTab || 'buttons';
                
                // Restore editing button safely
                const savedEditId = uiState.editingBtnId;
                const btnExists = state.buttons.find(b => b.id === savedEditId);
                state.editingBtnId = btnExists ? savedEditId : state.buttons[0]?.id;

            } catch (e) {
                state.buttons = [createDefaultButton()];
            }
        }

        function saveState() {
            safeSetItem('t2w_buttons_v4', JSON.stringify(state.buttons));
            safeSetItem('t2w_label_pos', state.labelPos);
            safeSetItem('t2w_voice', state.selectedVoiceURI);
            safeSetItem('t2w_haptics', state.hapticsEnabled);
            safeSetItem('t2w_audio', state.audioCueEnabled);
            safeSetItem('t2w_mode', state.activationMode);
            safeSetItem('t2w_target', state.touchTarget);
            safeSetItem('t2w_debounce', state.debounceTime);
            safeSetItem('t2w_orientation', state.orientationMode);
            safeSetItem('t2w_gain', state.playbackGain);
            safeSetItem('t2w_scan_interval', state.scanInterval);
            safeSetItem('t2w_scan_color', state.scanColor);
            safeSetItem('t2w_scan_tick', state.scanTick);
            safeSetItem('t2w_scan_announce', state.scanAnnounce);
            safeSetItem('t2w_scan_clear_debounce', state.scanClearDebounce);
            safeSetItem('t2w_output_bar_pos', JSON.stringify(state.outputBarPos));
            safeSetItem('t2w_output_bar_scale', state.outputBarScale);
            safeSetItem('t2w_show_output_bar_positioning', state.showOutputBarInPositioning);
            safeSetItem('t2w_ui_state', JSON.stringify({
                showSettings: state.showSettings,
                settingsTab: state.settingsTab,
                editingBtnId: state.editingBtnId
            }));
        }

        // --- FUNCTIONS RESTORED ---
        function openSettings() {
            stopScan();
            // Stop any active audio before entering settings
            if (currentPlaybackSource) {
                try { currentPlaybackSource.stop(); } catch(e) {}
                currentPlaybackSource = null;
            }
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            state.isSpeaking = false;
            state.playingButtonId = null;
            state.showSettings = true;
            if(!state.editingBtnId) state.editingBtnId = state.buttons[0]?.id;
            document.getElementById('settings-modal').classList.remove('hidden');
            renderSettingsContent();
            updateTabUI();
            saveState();
        }

        function closeSettings() {
            // Stop any in-progress recording so the mic stream is released
            if (state.isRecording && state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
                state.mediaRecorder.stop();
            }
            state.showSettings = false;
            document.getElementById('settings-modal').classList.add('hidden');
            saveState();
            renderButtons();
        }

        function safeIcons() {
            if(window.lucide && window.lucide.createIcons) window.lucide.createIcons();
        }

        function updateTabUI() {
            const b = document.getElementById('tab-buttons');
            const s = document.getElementById('tab-system');
            const active   = "flex-1 py-3 text-sm font-black uppercase tracking-wide border-b-2 transition-all border-indigo-400 text-white";
            const inactive = "flex-1 py-3 text-sm font-black uppercase tracking-wide border-b-2 transition-all border-transparent text-zinc-500 hover:text-zinc-300";
            if(state.settingsTab === 'buttons') {
                b.className = active;
                s.className = inactive;
            } else {
                s.className = active;
                b.className = inactive;
            }
        }

        // --- MODAL HANDLING ---
        let confirmCallback = null;
        function showConfirm(title, desc, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-desc').innerText = desc;
            confirmCallback = callback;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        // --- DOM INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            
            if (window.lucide) window.lucide.createIcons();
            
            if(window.speechSynthesis) {
                const loadVoices = () => {
                    state.voices = window.speechSynthesis.getVoices();
                    if (!state.selectedVoiceURI && state.voices.length) state.selectedVoiceURI = state.voices[0].voiceURI;
                };
                window.speechSynthesis.onvoiceschanged = loadVoices;
                loadVoices();
                // iOS requires a small delay to ensure voices are loaded
                setTimeout(loadVoices, 100);
            }

            renderButtons();
            
            // Initialize output bar position
            updateOutputBarPositionDOM();
            
            // Output bar drag/resize handlers
            const outputBar = document.getElementById('output-bar');
            if (outputBar) {
                outputBar.addEventListener('pointerdown', (e) => {
                    if (!state.isPositioningMode) return;
                    e.preventDefault();
                    e.stopPropagation();
                    outputBar.setPointerCapture(e.pointerId);
                    initOutputBarGesture(e);
                });
                outputBar.addEventListener('pointermove', (e) => {
                    if (!state.isPositioningMode || !gesture.active || gesture.target !== 'outputBar') return;
                    const rect = document.getElementById('main-canvas').getBoundingClientRect();
                    const dx = e.clientX - gesture.startCen.x;
                    const dy = e.clientY - gesture.startCen.y;
                    state.outputBarPos.x = Math.max(0, Math.min(100, gesture.startPos.x + (dx / rect.width) * 100));
                    state.outputBarPos.y = Math.max(0, Math.min(100, gesture.startPos.y + (dy / rect.height) * 100));
                    updateOutputBarPositionDOM();
                });
                outputBar.addEventListener('pointerup', (e) => {
                    if (gesture.active && gesture.target === 'outputBar') {
                        gesture.active = false;
                        gesture.target = null;
                        saveState();
                    }
                });
                outputBar.addEventListener('pointercancel', (e) => {
                    if (gesture.active && gesture.target === 'outputBar') {
                        gesture.active = false;
                        gesture.target = null;
                        saveState();
                    }
                });
                outputBar.addEventListener('wheel', (e) => {
                    if (!state.isPositioningMode) return;
                    e.preventDefault();
                    const direction = e.deltaY < 0 ? 1 : -1;
                    const newScale = Math.min(2.0, Math.max(0.5, state.outputBarScale + (direction * 0.1)));
                    state.outputBarScale = parseFloat(newScale.toFixed(2));
                    updateOutputBarPositionDOM();
                    saveState();
                }, { passive: false });
            }

            if (state.showSettings) {
                document.getElementById('settings-modal').classList.remove('hidden');
                renderSettingsContent();
                updateTabUI();
            }

            // First-run hint: reveal how to open settings
            if (!safeGetItem('t2w_hint_shown')) {
                safeSetItem('t2w_hint_shown', '1');
                const hint = document.createElement('div');
                hint.id = 'start-hint';
                hint.className = 'fixed bottom-10 left-1/2 z-50 -translate-x-1/2 bg-zinc-800/95 backdrop-blur border border-zinc-700 text-zinc-200 text-sm font-semibold px-5 py-3 rounded-full shadow-2xl flex items-center gap-2 pointer-events-none select-none';
                hint.innerHTML = `<i data-lucide="settings" class="w-4 h-4 text-indigo-400 shrink-0"></i>&thinsp;Hold the <span class="text-indigo-300 mx-1">&#9881;</span> icon 3 seconds to configure`;
                hint.style.opacity = '0';
                hint.style.transform = 'translateX(-50%) translateY(16px)';
                document.body.appendChild(hint);
                safeIcons();
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    hint.style.opacity = '1';
                    hint.style.transform = 'translateX(-50%) translateY(0)';
                    setTimeout(() => {
                        hint.style.opacity = '0';
                        hint.style.transform = 'translateX(-50%) translateY(16px)';
                        setTimeout(() => hint.remove(), 600);
                    }, 5000);
                }));
            }
            
            // Settings only opens via the 3-second hold — block any plain click.
            let holdFired = false;
            document.getElementById('settings-trigger').addEventListener('click', (e) => {
                e.preventDefault();
                holdFired = false; // consume any stale flag
            });
            document.getElementById('close-settings-top').onclick = closeSettings;
            document.getElementById('close-settings-btn').onclick = closeSettings;
            document.getElementById('settings-backdrop').addEventListener('click', closeSettings);
            
            document.getElementById('tab-buttons').onclick = () => {
                 state.settingsTab = 'buttons'; 
                 renderSettingsContent();
                 updateTabUI();
                 saveState();
            };
            document.getElementById('tab-system').onclick = () => {
                 state.settingsTab = 'system'; 
                 renderSettingsContent();
                 updateTabUI();
                 saveState();
            };
            
            // Scan overlay — any tap/click activates the currently highlighted button
            document.getElementById('scan-overlay').addEventListener('pointerdown', (e) => {
                if (state.activationMode !== 'scan' || state.showSettings || state.isPositioningMode) return;
                e.preventDefault();
                const btn = state.buttons[scanIdx];
                if (btn) activateSwitch(btn.id);
            }, { passive: false });

            document.getElementById('lock-pos-btn').onclick = () => togglePositioning(false);
            document.getElementById('reset-pos-btn').onclick = () => {
                state.buttons.forEach((b, i) => b.pos = { x: 50, y: 50 + (i * 10) });
                saveState();
                renderButtons();
            };
            document.getElementById('auto-arrange-btn').onclick = () => {
                arrangeGrid();
            };
            document.getElementById('toggle-output-bar-btn').onclick = () => {
                state.showOutputBarInPositioning = !state.showOutputBarInPositioning;
                updateOutputBarInPositioningMode();
                saveState();
                if (window.lucide) window.lucide.createIcons();
            };
            
            // Confirm Modal Listeners
            const modal = document.getElementById('confirm-modal');
            document.getElementById('btn-cancel-confirm').onclick = () => {
                modal.classList.add('hidden');
                confirmCallback = null;
            };
            document.getElementById('btn-do-confirm').onclick = () => {
                if(confirmCallback) confirmCallback();
                modal.classList.add('hidden');
                confirmCallback = null;
            };

            // Hold Logic
            const settingsTrigger = document.getElementById('settings-trigger');
            const holdRing = document.getElementById('hold-progress-ring');
            const settingsIcon = document.getElementById('settings-icon');
            let holdTimer;

            function startHold(e) {
                if (state.isPositioningMode) return;
                holdFired = false;
                settingsTrigger.classList.add('bg-zinc-800', 'scale-110');
                settingsIcon.classList.add('text-indigo-400');
                let start = Date.now();
                holdTimer = setInterval(() => {
                    let pct = Math.min(100, (Date.now() - start) / 3000 * 100);
                    holdRing.style.strokeDashoffset = 125.6 - (125.6 * pct / 100);
                    if (pct >= 100) { holdFired = true; endHold(); openSettings(); }
                }, 16);
            }

            function endHold() {
                clearInterval(holdTimer);
                settingsTrigger.classList.remove('bg-zinc-800', 'scale-110');
                settingsIcon.classList.remove('text-indigo-400');
                holdRing.style.strokeDashoffset = 125.6;
            }
            
            settingsTrigger.addEventListener('mousedown', startHold);
            // passive:false + preventDefault stops iOS from showing the native
            // long-press callout (Save Image / Copy) while the progress ring fills.
            settingsTrigger.addEventListener('touchstart', (e) => { e.preventDefault(); startHold(e); }, { passive: false });
            ['mouseup', 'mouseleave', 'touchend'].forEach(ev => settingsTrigger.addEventListener(ev, endHold));
        });

        // --- RENDER & LOGIC ---
        function renderButtons() {
            stopScan();
            const mainCanvas = document.getElementById('main-canvas');
            if(!mainCanvas) return;
            mainCanvas.innerHTML = '';

            state.buttons.forEach(btn => {
                const wrapper = document.createElement('div');
                wrapper.className = 'absolute btn-enter';
                wrapper.dataset.btnWrapper = btn.id;
                wrapper.style.left = `${btn.pos.x}%`;
                wrapper.style.top = `${btn.pos.y}%`;
                wrapper.style.setProperty('--btn-scale', btn.scale || 1);
                wrapper.style.transform = `translate(-50%, -50%) scale(${btn.scale || 1})`;
                // Stagger entrance per button
                wrapper.style.animationDelay = `${state.buttons.indexOf(btn) * 80}ms`;
                
                const rotatable = document.createElement('div');
                rotatable.className = 'relative group perspective-1000 btn-rotatable transition-transform duration-300 ease-out';
                
                const btnEl = document.createElement('button');
                btnEl.className = `app-button relative w-64 h-64 md:w-80 md:h-80 rounded-full ${btn.color.shadow} transition-all duration-100 transform flex items-center justify-center overflow-hidden outline-none cursor-pointer select-none`;
                btnEl.style.borderBottomWidth = '20px';
                btnEl.style.background = GRADIENTS[btn.color.name] || '';
                btnEl.dataset.id = btn.id;

                btnEl.innerHTML = `
                    ${state.isPositioningMode ? `<div class="absolute inset-0 flex items-center justify-center bg-black/20 z-20 pointer-events-none"><i data-lucide="grip" class="w-16 h-16 text-white opacity-80"></i></div>` : ''}
                    <!-- Primary specular highlight: upper-left, simulates overhead-angled light -->
                    <div style="position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse 62% 44% at 36% 24%, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.04) 52%, transparent 100%)"></div>
                    <!-- Secondary specular: tiny hot-spot at the apex -->
                    <div style="position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse 28% 18% at 36% 18%, rgba(255,255,255,0.22) 0%, transparent 100%)"></div>
                    <!-- Bottom ambient bounce: subtle light from the surface below -->
                    <div style="position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse 70% 28% at 50% 104%, rgba(255,255,255,0.13) 0%, transparent 100%)"></div>
                    <!-- Surface vignette: darkens the outer rim to suggest curvature -->
                    <div style="position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 50% 50%, transparent 42%, rgba(0,0,0,0.22) 100%)"></div>
                    <!-- Bevel inset shadow (lit top, dark bottom, subtle rim) -->
                    <div style="position:absolute;inset:0;border-radius:50%;pointer-events:none;box-shadow:inset 0 3px 7px rgba(255,255,255,0.22),inset 0 -5px 14px rgba(0,0,0,0.28),inset 0 0 0 1px rgba(255,255,255,0.09)"></div>
                    ${(state.labelPos === 'on' && btn.label) ? `<span class="relative z-10 text-3xl font-black uppercase tracking-widest px-4 text-center ${btn.color.text} pointer-events-none select-none" style="text-shadow: ${btn.color.name === 'Yellow' ? '0 0 8px rgba(255,255,255,0.9), 0 0 12px rgba(255,255,255,0.7), 0 2px 4px rgba(0,0,0,0.3), -1px -1px 0 rgba(255,255,255,0.5), 1px -1px 0 rgba(255,255,255,0.5), -1px 1px 0 rgba(255,255,255,0.5), 1px 1px 0 rgba(255,255,255,0.5)' : '0 0 8px rgba(0,0,0,0.95), 0 0 12px rgba(0,0,0,0.8), 0 2px 6px rgba(0,0,0,0.6), -1px -1px 0 rgba(0,0,0,0.7), 1px -1px 0 rgba(0,0,0,0.7), -1px 1px 0 rgba(0,0,0,0.7), 1px 1px 0 rgba(0,0,0,0.7)'}">${escHtml(btn.label)}</span>` : ''}
                `;

                btnEl.addEventListener('wheel', (e) => {
                    if (state.showSettings || !state.isPositioningMode) return;
                    e.preventDefault();
                    const direction = e.deltaY < 0 ? 1 : -1;
                    const newScale = Math.min(3.0, Math.max(0.4, (btn.scale || 1) + (direction * 0.1)));
                    btn.scale = parseFloat(newScale.toFixed(2));
                    updateButtonPositionDOM(btn.id);
                    saveState();
                }, { passive: false });

                // Tracks which pointer IDs are currently held on this button (release mode).
                // Each button gets its own Set so multi-touch across buttons works correctly.
                const heldPointers = new Set();

                btnEl.addEventListener('pointerdown', (e) => {
                    if (state.isPositioningMode) {
                        e.stopPropagation();

                        e.stopPropagation();
                        if (e.pointerType === 'touch') e.preventDefault();

                    } else if (state.activationMode === 'release' && !state.showSettings && state.touchTarget === 'button') {
                        // Depress the button visually immediately on touch-down.
                        // setPointerCapture keeps pointermove firing on this element even
                        // after the pointer leaves it — without it, mouse pointermove stops
                        // at the element edge and the button never pops back up on drag-off.
                        e.stopPropagation();
