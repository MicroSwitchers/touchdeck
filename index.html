<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS TTS Tester</title>
    <style>
        body { font-family: -apple-system, system-ui; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #f4f4f9; }
        textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        button { padding: 15px; border: none; border-radius: 8px; background-color: #007AFF; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:active { background-color: #0051a8; }
        .status { font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <h2>iOS TTS Test</h2>
    <textarea id="textInput" placeholder="Type something here...">Hello! This is a test of the iOS Web Speech API. If you hear this, it works!</textarea>
    
    <button id="speakBtn">Speak Aloud</button>
    <p class="status" id="statusMsg">Waiting for user interaction...</p>

    <script>
        const speakBtn = document.getElementById('speakBtn');
        const textInput = document.getElementById('textInput');
        const statusMsg = document.getElementById('statusMsg');
        
        let synth = window.speechSynthesis;
        let voices = [];

        // 1. Critical for iOS: Load voices and handle the async change event
        function populateVoices() {
            voices = synth.getVoices();
            if (voices.length > 0) {
                statusMsg.innerText = "Speech engine ready. " + voices.length + " voices loaded.";
            }
        }

        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = populateVoices;
        }
        populateVoices();

        speakBtn.addEventListener('click', () => {
            if (synth.speaking) {
                console.error('Already speaking...');
                return;
            }

            if (textInput.value !== '') {
                // 2. iOS WORKAROUND: Prime the engine
                // On some iOS versions, the engine needs to be "resumed" inside the click handler
                if (synth.paused) {
                    synth.resume();
                }

                const utterThis = new SpeechSynthesisUtterance(textInput.value);

                // 3. Selection of a high-quality iOS voice (Samantha is standard)
                const preferredVoice = voices.find(v => v.name.includes('Samantha') || (v.lang === 'en-US' && v.default));
                if (preferredVoice) {
                    utterThis.voice = preferredVoice;
                }

                utterThis.onstart = () => { statusMsg.innerText = "Speaking..."; };
                utterThis.onend = () => { statusMsg.innerText = "Finished."; };
                utterThis.onerror = (event) => { statusMsg.innerText = "Error: " + event.error; };

                // 4. Rate and Pitch (iOS handles 1.0 best)
                utterThis.pitch = 1.0;
                utterThis.rate = 1.0;

                synth.speak(utterThis);
            }
        });
    </script>
</body>
</html>
