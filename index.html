                    const outside = Math.hypot(
                        e.clientX - (rect.left + rect.width / 2),
                        e.clientY - (rect.top + rect.height / 2)
                    ) > rect.width / 2;
                    if (outside) {
                        // Slide off: pop up visually and activate immediately
                        heldPointers.delete(e.pointerId);
                        if (state.activeButtonId === btn.id) { state.activeButtonId = null; updateVisuals(); }
                        activateSwitch(btn.id);
                    }
                });

                // Release mode: activate when finger lifts if still on button
                btnEl.addEventListener('pointerup', (e) => {
                    if (!state.isPositioningMode && !state.showSettings && state.activationMode === 'release' && state.touchTarget === 'button') {
                        e.stopPropagation();
                        if (heldPointers.delete(e.pointerId)) {
                            // Finger lifted while still over button — activate
                            if (state.activeButtonId === btn.id) { state.activeButtonId = null; updateVisuals(); }
                            activateSwitch(btn.id);
                        }
                        // If already slid off, it was already activated in pointermove
                    }
                });

                // System cancelled the gesture (palm rejection, notification, etc.)
                btnEl.addEventListener('pointercancel', (e) => {
                    if (heldPointers.delete(e.pointerId) && state.activeButtonId === btn.id) {
                        state.activeButtonId = null;
                        updateVisuals();
                    }
                });

                rotatable.appendChild(btnEl);

                if (state.labelPos === 'under' && btn.label) {
                    const lbl = document.createElement('div');
                    lbl.className = 'absolute left-1/2 -translate-x-1/2 top-[115%] px-8 py-3 bg-black/60 backdrop-blur-md rounded-2xl border border-white/10 whitespace-nowrap pointer-events-none';
                    lbl.innerHTML = `<span class="text-2xl font-bold tracking-wider text-white uppercase" style="text-shadow:0 1px 4px rgba(0,0,0,0.5)">${escHtml(btn.label)}</span>`;
                    rotatable.appendChild(lbl);
                }
                wrapper.appendChild(rotatable);
                mainCanvas.appendChild(wrapper);
            });
            
            safeIcons();
            updateVisuals();
            if (state.activationMode === 'scan' && !state.showSettings && !state.isPositioningMode) startScan();
        }

        function updateVisuals() {
            const btns = document.querySelectorAll('.app-button');
            btns.forEach(b => {
                if (state.inDebounce || state.isPositioningMode) b.style.opacity = '0.9';
                else b.style.opacity = '1';
                const isPressed = b.dataset.id === state.activeButtonId;
                const isSpeakingThis = state.isSpeaking && state.playingButtonId === b.dataset.id;
                if (isPressed && !state.isPositioningMode) {
                    b.classList.add('translate-y-4', 'brightness-90', 'scale-[0.93]');
                    b.style.borderBottomWidth = '4px';
                    b.style.boxShadow = [
                        '0  4px 10px -2px rgba(0,0,0,0.60)',
                        '0  2px  5px -1px rgba(0,0,0,0.45)',
                        'inset 0  6px 18px rgba(0,0,0,0.45)',
                        'inset 0  2px  6px rgba(0,0,0,0.30)',
                        'inset 0 -1px  4px rgba(255,255,255,0.08)'
                    ].join(',');
                } else {
                    b.classList.remove('translate-y-4', 'brightness-90', 'scale-[0.93]');
                    b.style.borderBottomWidth = '20px';
                    if (!isSpeakingThis) b.style.boxShadow = '';
                }
                // Speaking border
                const btnData = state.buttons.find(bd => bd.id === b.dataset.id);
                if (isSpeakingThis && btnData) {
                    const borderColor = GLOW_COLORS[btnData.color.name] || 'rgba(255,255,255,0.9)';
                    b.style.setProperty('--speaking-color', borderColor);
                    b.classList.add('speaking-border');
                } else {
                    b.classList.remove('speaking-border');
                    b.style.removeProperty('--speaking-color');
                }
            });
            const rot = state.orientationMode === 'auto' ? 0 : (ORIENTATIONS.find(o => o.id === state.orientationMode)?.rotate || 0);
            document.querySelectorAll('.header-rotate, #positioning-overlay, .btn-rotatable').forEach(el => {
                el.style.transform = `rotate(${rot}deg)`;
            });
        }

        const gesture = { active: false, target: null, btnId: null, startScale: 1, startDist: 0, startPos: {x:0,y:0}, startCen: {x:0,y:0} };

        // Fast DOM update for position/scale during drag (avoids full re-render).
        // Must also update --btn-scale so the btn-enter animation's forwards fill
        // (which renders scale(var(--btn-scale))) reflects the new value immediately —
        // CSS animation fills sit above inline styles in the cascade.
        function updateButtonPositionDOM(btnId) {
            const btn = state.buttons.find(b => b.id === btnId);
            if (!btn) return;
            const wrapper = document.querySelector(`[data-btn-wrapper="${btnId}"]`);
            if (!wrapper) return;
            const s = btn.scale || 1;
            wrapper.style.left = `${btn.pos.x}%`;
            wrapper.style.top = `${btn.pos.y}%`;
            wrapper.style.setProperty('--btn-scale', s);
            wrapper.style.transform = `translate(-50%, -50%) scale(${s})`;
        }

        function updateOutputBarPositionDOM() {
            const bar = document.getElementById('output-bar');
            if (!bar) return;
            bar.style.left = `${state.outputBarPos.x}%`;
            bar.style.top = `${state.outputBarPos.y}%`;
            bar.style.transform = `translate(-50%, -50%) scale(${state.outputBarScale})`;
        }

        function initGesture(e, btnId) {
            const btn = state.buttons.find(b => b.id === btnId);
            const t = e.touches ? e.touches[0] : e;
            gesture.active = true;
            gesture.target = 'button';
            gesture.btnId = btnId;
            gesture.startScale = btn.scale || 1;
            gesture.startPos = { ...btn.pos };
            gesture.startCen = { x: t.clientX, y: t.clientY };
            gesture.startDist = 0;
        }

        function initOutputBarGesture(e) {
            const t = e.touches ? e.touches[0] : e;
            gesture.active = true;
            gesture.target = 'outputBar';
            gesture.btnId = null;
            gesture.startScale = state.outputBarScale;
            gesture.startPos = { ...state.outputBarPos };
            gesture.startCen = { x: t.clientX, y: t.clientY };
            gesture.startDist = 0;
        }

        function updateOutputBarInPositioningMode() {
            const outputBar = document.getElementById('output-bar');
            const toggleLabel = document.getElementById('output-bar-toggle-label');
            if (!outputBar) return;
            
            if (state.showOutputBarInPositioning) {
                outputBar.style.opacity = '1';
                outputBar.classList.remove('pointer-events-none');
                outputBar.classList.add('pointer-events-auto');
                const inner = outputBar.querySelector('div');
                if (inner) {
                    inner.style.cursor = 'move';
                    inner.style.background = 'rgba(99,102,241,0.15)';
                    inner.style.borderColor = 'rgba(99,102,241,0.45)';
                }
                const textEl = document.getElementById('output-text');
                if (textEl) textEl.textContent = 'Voice Readout';
                updateOutputBarPositionDOM();
                if (toggleLabel) toggleLabel.textContent = 'Voice Readout: On';
            } else {
                outputBar.style.opacity = '0';
                outputBar.classList.add('pointer-events-none');
                outputBar.classList.remove('pointer-events-auto');
                if (toggleLabel) toggleLabel.textContent = 'Voice Readout: Off';
            }
        }

        function togglePositioning(active) {
            state.isPositioningMode = active;
            const overlay = document.getElementById('positioning-overlay');
            const hdr = document.getElementById('header');
            const outputBar = document.getElementById('output-bar');
            if (active) {
                // Stop scanning while in positioning mode - no actions available
                stopScan();
                overlay.classList.remove('hidden');
                hdr.classList.add('opacity-0', 'pointer-events-none');
                // Make output bar visible and draggable based on user preference
                updateOutputBarInPositioningMode();
                // Refresh icons for positioning overlay buttons
                if (window.lucide) window.lucide.createIcons();
            } else {
                overlay.classList.add('hidden');
                hdr.classList.remove('opacity-0', 'pointer-events-none');
                // Restore output bar to normal state
                if (outputBar) {
                    outputBar.style.opacity = '0';
                    outputBar.classList.add('pointer-events-none');
                    outputBar.classList.remove('pointer-events-auto');
                    const inner = outputBar.querySelector('div');
                    if (inner) {
                        inner.style.cursor = '';
                        inner.style.background = 'rgba(0,0,0,0.82)';
                        inner.style.borderColor = 'rgba(255,255,255,0.15)';
                    }
                }
                saveState();
            }
            renderButtons(); // This will auto-restart scanning if needed
        }

        window.addEventListener('touchmove', (e) => {
            if (!state.isPositioningMode || !gesture.active) return;
            e.preventDefault();
            
            if (gesture.target === 'button') {
                const btn = state.buttons.find(b => b.id === gesture.btnId);
                if (!btn) return;
                if (e.touches.length === 2) {
                    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    if (gesture.startDist === 0) gesture.startDist = d;
                    btn.scale = Math.min(3, Math.max(0.4, gesture.startScale * (d / gesture.startDist)));
                } else {
                    const rect = document.getElementById('main-canvas').getBoundingClientRect();
                    const dx = e.touches[0].clientX - gesture.startCen.x;
                    const dy = e.touches[0].clientY - gesture.startCen.y;
                    btn.pos.x = Math.max(0, Math.min(100, gesture.startPos.x + (dx / rect.width) * 100));
                    btn.pos.y = Math.max(0, Math.min(100, gesture.startPos.y + (dy / rect.height) * 100));
                }
                updateButtonPositionDOM(gesture.btnId);
            }
        }, { passive: false });

        window.addEventListener('mousemove', (e) => {
            if (!state.isPositioningMode || !gesture.active) return;
            
            if (gesture.target === 'button') {
                const btn = state.buttons.find(b => b.id === gesture.btnId);
                if (!btn) return;
                const rect = document.getElementById('main-canvas').getBoundingClientRect();
                const dx = e.clientX - gesture.startCen.x;
                const dy = e.clientY - gesture.startCen.y;
                btn.pos.x = Math.max(0, Math.min(100, gesture.startPos.x + (dx / rect.width) * 100));
                btn.pos.y = Math.max(0, Math.min(100, gesture.startPos.y + (dy / rect.height) * 100));
                updateButtonPositionDOM(gesture.btnId);
            }
        });

        window.addEventListener('touchend', () => {
            if (gesture.active) {
                gesture.active = false;
                saveState();
            }
            // Release mode on touch for whole-screen target
            if (state.activationMode === 'release' && !state.isPositioningMode && !state.showSettings) {
                if (state.buttons.length === 1 && state.touchTarget === 'screen') activateSwitch(state.buttons[0].id);
            }
        });
        window.addEventListener('mouseup', () => {
            if (gesture.active) {
                gesture.active = false;
                saveState(); // Save on drop/end
            }
            if (state.activationMode === 'release' && !state.isPositioningMode && !state.showSettings) {
                if (state.buttons.length === 1 && state.touchTarget === 'screen') activateSwitch(state.buttons[0].id);
            }
        });

        async function activateSwitch(btnId) {
            if (state.isPositioningMode || state.showSettings || state.inDebounce) return;
            if (state.debounceTime > 0) {
                state.inDebounce = true;
                if (debounceTimeoutId) clearTimeout(debounceTimeoutId);
                debounceTimeoutId = setTimeout(() => {
                    state.inDebounce = false;
                    debounceTimeoutId = null;
                    updateVisuals();
                }, state.debounceTime * 1000);
            }

            if (state.hapticsEnabled && navigator.vibrate) try{ navigator.vibrate(50); }catch(e){}
            
            if (state.audioCueEnabled) {
                 try {
                     const ctx = initAudioCtx();
                     if (ctx) {
                         const osc = ctx.createOscillator();
                         const g = ctx.createGain();
                         osc.connect(g); g.connect(ctx.destination);
                         osc.frequency.setValueAtTime(600, ctx.currentTime);
                         osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime+0.15);
                         g.gain.setValueAtTime(0, ctx.currentTime);
                         g.gain.linearRampToValueAtTime(0.2, ctx.currentTime+0.02);
                         g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.15);
                         osc.start(ctx.currentTime); osc.stop(ctx.currentTime+0.15);
                     }
                 } catch(e){}
            }

            state.activeButtonId = btnId;
            updateVisuals();
            setTimeout(() => { state.activeButtonId = null; updateVisuals(); }, 200);

            const btn = state.buttons.find(b => b.id === btnId);
            if (!btn) return;

            const idx = btn.phraseIndex;
            const audioKey = `${btn.id}_${idx}`;
            // Capture the phrase text NOW before phraseIndex advances, so error
            // callbacks can still fall back to the correct phrase.
            const phraseText = (btn.phrases[idx] || '').trim();
            const displayText = phraseText || btn.label || '';
            if (displayText) showOutputBar(displayText);

            let played = false;
            if (btn.hasAudio && btn.hasAudio[idx]) {
                const blob = await getAudioBlob(audioKey);
                if (blob) {
                    played = true;
                    state.isSpeaking = true;
                    state.playingButtonId = btn.id;
                    updateVisuals();
                    // Use AudioContext playback (iOS-safe) instead of HTMLAudioElement.
                    // Awaiting here only waits for decode+start (not full playback), so
                    // phraseIndex cycling below still happens immediately after audio begins.
                    currentPlaybackSource = await createAndPlayAudio(blob, {
                        onEnded: () => {
                            currentPlaybackSource = null;
                            state.isSpeaking = false;
                            state.playingButtonId = null;
                            updateVisuals();
                        },
                        onError: () => {
                            currentPlaybackSource = null;
                            state.isSpeaking = false;
                            state.playingButtonId = null;
                            fallbackSpeak(btn, phraseText);
                        }
                    });
                }
            }
            if (!played) fallbackSpeak(btn, phraseText);

            const valid = btn.phrases.filter((p, i) => (p && p.trim()) || (btn.hasAudio && btn.hasAudio[i]));
            if (valid.length > 1) {
                let next = (idx + 1) % 3;
                let s = 0;
                while((!btn.phrases[next] || !btn.phrases[next].trim()) && (!btn.hasAudio || !btn.hasAudio[next]) && s<5) {
                    next = (next+1)%3; s++;
                }
                btn.phraseIndex = next;
                saveState();
            }
        }

        // txt is pre-captured so we always speak the right phrase even if phraseIndex
        // has already advanced by the time an audio error fires asynchronously.
        function fallbackSpeak(btn, txt) {
            if (txt === undefined) txt = (btn.phrases[btn.phraseIndex] || btn.phrases.find(p => p) || '').trim();
            if (!txt) {
                // Nothing to speak — ensure speaking indicators are cleared
                state.isSpeaking = false;
                state.playingButtonId = null;
                updateVisuals();
                return;
            }
            if (window.speechSynthesis) {
                // iOS fix: Ensure voices are loaded
                if (state.voices.length === 0) {
                    state.voices = window.speechSynthesis.getVoices();
                    if (state.voices.length > 0 && !state.selectedVoiceURI) {
                        state.selectedVoiceURI = state.voices[0].voiceURI;
                    }
                }
                
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(txt);
                
                // iOS fix: Only set voice if we have voices available
                if (state.voices.length > 0) {
                    const v = state.voices.find(vo => vo.voiceURI === state.selectedVoiceURI);
                    if (v) u.voice = v;
                }
                
                u.rate = 0.9;
                u.onstart = () => { 
                    state.isSpeaking = true; 
                    state.playingButtonId = btn.id;
                    updateVisuals(); 
                };
                u.onend = u.onerror = () => { 
                    state.isSpeaking = false; 
                    state.playingButtonId = null; 
                    updateVisuals(); 
                };
                
                // iOS fix: Small delay before speaking
                setTimeout(() => {
                    window.speechSynthesis.speak(u);
                }, 10);
            } else {
                state.isSpeaking = false;
                state.playingButtonId = null;
                updateVisuals();
            }
        }

        async function toggleRecording(btnId, phraseIndex, btnElement) {
            if (state.isRecording) {
                if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') state.mediaRecorder.stop();
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // Pick the best MIME type for this platform (webm on Chrome/Android, mp4 on iOS/Safari)
                const mimeType = getSupportedMimeType();
                const options = mimeType ? { mimeType } : {};
                const mediaRecorder = new MediaRecorder(stream, options);
                const chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) chunks.push(e.data);
                };

                const cleanup = (saveBlob) => async () => {
                    stream.getTracks().forEach(t => t.stop());
                    state.isRecording = false;
                    state.mediaRecorder = null;
                    if (saveBlob && chunks.length > 0) {
                        const blob = new Blob(chunks, { type: mimeType || 'audio/webm' });
                        await saveAudioBlob(`${btnId}_${phraseIndex}`, blob);
                        const btn = state.buttons.find(b => b.id === btnId);
                        if (btn) {
                            if (!btn.hasAudio) btn.hasAudio = [false, false, false];
                            btn.hasAudio[phraseIndex] = true;
                        }
                        saveState();
                    }
                    renderSettingsContent();
                };

                mediaRecorder.onstop = cleanup(true);
                mediaRecorder.onerror = cleanup(false);

                // 100 ms timeslices: ensures ondataavailable fires regularly on all browsers
                // (without a timeslice, Firefox fires it only once at stop)
                mediaRecorder.start(100);
                state.isRecording = true;
                state.mediaRecorder = mediaRecorder;
                btnElement.innerHTML = `<i data-lucide="square" class="w-4 h-4 fill-current"></i>`;
                btnElement.classList.add('bg-red-600', 'text-white', 'recording-pulse');
                safeIcons();
            } catch (err) {
                const msg = err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError'
                    ? 'Microphone access was denied. Please allow mic access in your browser settings.'
                    : err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError'
                    ? 'No microphone found on this device.'
                    : err.name === 'NotReadableError'
                    ? 'Microphone is already in use by another app.'
                    : 'Could not start recording: ' + (err.message || err.name);
                alert(msg);
            }
        }

        let currentPlaybackSource = null;
        let activePreviewSource = null;
        async function playPreview(btnId, phraseIndex) {
            if (activePreviewSource) {
                try { activePreviewSource.stop(); } catch(e) {}
                activePreviewSource = null;
            }
            // Unlock AudioContext synchronously within this user-gesture handler
            // so the async getAudioBlob() call below doesn't block playback on iOS.
            initAudioCtx();
            const blob = await getAudioBlob(`${btnId}_${phraseIndex}`);
            if (blob) {
                activePreviewSource = await createAndPlayAudio(blob, {
                    onEnded: () => { activePreviewSource = null; },
                    onError: () => { activePreviewSource = null; }
                });
            }
        }

        async function deleteRecording(btnId, phraseIndex) {
            await deleteAudioBlob(`${btnId}_${phraseIndex}`);
            const btn = state.buttons.find(b => b.id === btnId);
            if(btn.hasAudio) btn.hasAudio[phraseIndex] = false;
            saveState();
            renderSettingsContent();
        }

        function renderSettingsContent() {
            const settingsContent = document.getElementById('settings-content');
            settingsContent.innerHTML = '';
            
            if (state.settingsTab === 'buttons') {
                const sel = document.createElement('div');
                sel.className = 'flex gap-2 overflow-x-auto pb-2 mb-6';
                state.buttons.forEach((b,i) => {
                     const btn = document.createElement('button');
                     const active = state.editingBtnId === b.id;
                     btn.className = `flex items-center gap-2 px-4 py-3 rounded-xl border shrink-0 transition-all ${active ? 'border-indigo-400 ring-1 ring-indigo-400/30 text-indigo-200' : 'border-white/10 text-zinc-400 opacity-70 hover:opacity-100'}`;
                     btn.style.background = active ? 'rgba(99,102,241,0.18)' : 'rgba(255,255,255,0.04)';
                     btn.innerHTML = `<div class="w-3 h-3 rounded-full shrink-0" style="background:${GRADIENTS[b.color.name]||''}"></div><span class="text-xs font-bold uppercase">${escHtml(b.label) || 'Button '+(i+1)}</span>`;
                     btn.onclick = () => { state.editingBtnId = b.id; renderSettingsContent(); saveState(); };
                     sel.appendChild(btn);
                });
                if(state.buttons.length < 4) {
                    const add = document.createElement('button');
                    add.className = 'px-4 py-3 rounded-xl border border-dashed border-indigo-400/40 text-indigo-400/70 flex items-center gap-2 shrink-0 hover:border-indigo-400 hover:text-indigo-300 transition-all';
                    add.style.background = 'rgba(99,102,241,0.05)';
                    add.innerHTML = `<i data-lucide="plus" class="w-4 h-4"></i> Add`;
                    add.onclick = () => {
                        const off = state.buttons.length*10;
                        state.buttons.push({ ...createDefaultButton(), id: Date.now().toString(), pos: { x: 50+off, y: 50-off }, color: COLORS[state.buttons.length % COLORS.length] });

                        if (state.buttons.length > 1) state.touchTarget = 'button';

                        state.editingBtnId = state.buttons[state.buttons.length-1].id;
                        renderSettingsContent();
                        saveState();
                    };
                    sel.appendChild(add);
                }
                settingsContent.appendChild(sel);

                const editBtn = state.buttons.find(b => b.id === state.editingBtnId);
                if (editBtn) {
                    const form = document.createElement('div');
                    form.className = 'space-y-6';
                    form.innerHTML = `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-bold text-indigo-400 uppercase flex items-center gap-2 mb-2"><i data-lucide="edit-3" class="w-3 h-3"></i> Button Label</label>
                                <input class="w-full p-3 rounded-xl text-white outline-none transition-all" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1)" value="${escHtml(editBtn.label)}" id="inp-label" placeholder="e.g., Yes, Help, More" onfocus="this.style.borderColor='#818cf8';this.style.boxShadow='0 0 0 3px rgba(99,102,241,0.2)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)';this.style.boxShadow='none'">
                                <p class="text-[9px] text-zinc-500 mt-1.5 leading-tight">Shown on the button. Leave blank for phrases only.</p>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-pink-400 uppercase flex items-center gap-2 mb-2"><i data-lucide="palette" class="w-3 h-3"></i> Button Color</label>
                                <div class="grid grid-cols-4 gap-2" id="grid-color"></div>
                            </div>
                        </div>
                        <div class="rounded-xl p-4" style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08)">
                            <label class="text-[10px] text-amber-400 uppercase font-bold block mb-3 flex items-center gap-2">
                                <i data-lucide="mouse-pointer-2" class="w-3 h-3"></i> Activation Area
                            </label>
                            <div class="flex gap-2">
                                <button id="target-screen" class="flex-1 p-3 rounded-xl border text-xs font-bold uppercase transition-all ${state.touchTarget === 'screen' ? 'text-indigo-200 border-indigo-400' : 'text-zinc-400 border-white/10'}" style="background:${state.touchTarget === 'screen' ? 'linear-gradient(135deg,rgba(79,70,229,0.3),rgba(124,58,237,0.2))' : 'rgba(255,255,255,0.04)'}">Whole Screen</button>
                                <button id="target-button" class="flex-1 p-3 rounded-xl border text-xs font-bold uppercase transition-all ${state.touchTarget === 'button' ? 'text-indigo-200 border-indigo-400' : 'text-zinc-400 border-white/10'}" style="background:${state.touchTarget === 'button' ? 'linear-gradient(135deg,rgba(79,70,229,0.3),rgba(124,58,237,0.2))' : 'rgba(255,255,255,0.04)'}">Button Only</button>
                            </div>
                            ${state.buttons.length > 1 ? '<p class="text-[9px] text-amber-400/80 mt-2 flex items-center gap-1"><i data-lucide="info" class="w-3 h-3"></i> "Whole Screen" requires a single button layout.</p>' : '<p class="text-[9px] text-zinc-500 mt-2 flex items-center gap-1"><i data-lucide="info" class="w-3 h-3"></i> Tap anywhere on screen to activate.</p>'}
                        </div>

                 }
                 sys.querySelector('#lbl-on').onclick=()=>{state.labelPos='on'; renderSettingsContent(); saveState(); renderButtons();}
                 sys.querySelector('#lbl-under').onclick=()=>{state.labelPos='under'; renderSettingsContent(); saveState(); renderButtons();}
                 sys.querySelector('#lbl-off').onclick=()=>{state.labelPos='off'; renderSettingsContent(); saveState(); renderButtons();}
                 ORIENTATIONS.forEach(o => {
                     const el = sys.querySelector(`#ori-${o.id}`);
                     if (el) el.onclick = () => { state.orientationMode = o.id; renderSettingsContent(); saveState(); updateVisuals(); };
                 });
                 sys.querySelector('#sys-unlock').onclick=()=>{closeSettings(); togglePositioning(true);}
                 sys.querySelector('#sys-fs').onclick=()=>{if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e=>{}); else document.exitFullscreen();}
                 const installBtn = sys.querySelector('#sys-install');
                 if (installBtn) {
                     installBtn.onclick = async () => {
                         if (!deferredInstallPrompt) return;
                         deferredInstallPrompt.prompt();
                         await deferredInstallPrompt.userChoice;
                         deferredInstallPrompt = null;
                         renderSettingsContent();
                     };
                 }
                 
                 // Storage Logic
                 sys.querySelector('#btn-clear-storage').onclick = () => {
                     showConfirm(
                         "Delete all audio?", 
                         "This will permanently remove all recorded sounds from this device. Button text labels will be kept.",
                         async () => {
                             await clearAllAudioData();
                             state.buttons.forEach(b => b.hasAudio = [false, false, false]);
                             saveState();
                             renderSettingsContent();
                         }
                     );
                 };
                 
                 getStorageSize().then(size => {
                     const el = document.getElementById('storage-size');
                     if(el) el.innerText = formatBytes(size);
                 });

                 settingsContent.appendChild(sys);
            }
            safeIcons();
        }
        
        // --- OUTPUT DISPLAY BAR ---
        let outputBarTimer = null;
        function showOutputBar(text) {
            const bar = document.getElementById('output-bar');
            const span = document.getElementById('output-text');
            if (!bar || !span) return;
            if (outputBarTimer) { clearTimeout(outputBarTimer); outputBarTimer = null; }
            span.textContent = text;
            bar.classList.remove('hiding');
            updateOutputBarPositionDOM(); // Apply current position
            bar.style.opacity = '1';
            outputBarTimer = setTimeout(() => {
                bar.classList.add('hiding');
                outputBarTimer = setTimeout(() => {
                    bar.style.opacity = '0';
                    bar.classList.remove('hiding');
                }, 400);
            }, 6000);
        }

        // --- SCANNING MODE ---
        let scanTimer = null;
        let scanIdx = 0;
        let debounceTimeoutId = null;

        function startScan() {
            stopScan();
            if (state.activationMode !== 'scan' || state.buttons.length === 0 || state.showSettings || state.isPositioningMode) return;
            scanIdx = 0;
            updateScanHighlight();
            if (state.scanTick) playScanTick();
            scanTimer = setInterval(() => {
                scanIdx = (scanIdx + 1) % state.buttons.length;
                // Clear debounce on scan advance if enabled
                if (state.scanClearDebounce && state.inDebounce) {
                    if (debounceTimeoutId) {
                        clearTimeout(debounceTimeoutId);
                        debounceTimeoutId = null;
                    }
                    state.inDebounce = false;
                    updateVisuals();
                }
                updateScanHighlight();
                if (state.scanTick) playScanTick();
            }, state.scanInterval * 1000);
            const overlay = document.getElementById('scan-overlay');
            if (overlay) overlay.classList.remove('hidden');
        }

        function stopScan() {
            if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
            document.querySelectorAll('.app-button').forEach(b => {
                b.classList.remove('scan-highlight');
                b.style.removeProperty('--scan-color');
                b.style.removeProperty('--scan-glow');
            });
            const overlay = document.getElementById('scan-overlay');
            if (overlay) overlay.classList.add('hidden');
        }

        function updateScanHighlight() {
            const color = SCAN_COLORS[state.scanColor] || SCAN_COLORS['Yellow'];
            const btns = document.querySelectorAll('.app-button');
            btns.forEach((b, i) => {
                const active = i === scanIdx;
                b.classList.toggle('scan-highlight', active);
                if (active) {
                    b.style.setProperty('--scan-color', color.ring);
                    b.style.setProperty('--scan-glow',  color.glow);
                    // Announce button label if enabled
                    if (state.scanAnnounce && window.speechSynthesis) {
                        const btn = state.buttons[scanIdx];
                        const labelText = (btn?.label || '').trim();
                        if (labelText) {
                            // iOS fix: Ensure voices are loaded
                            if (state.voices.length === 0) {
                                state.voices = window.speechSynthesis.getVoices();
                            }
                            
                            const utterance = new SpeechSynthesisUtterance(labelText);
                            
                            // iOS fix: Only set voice if available
                            if (state.voices.length > 0) {
                                const voice = state.voices.find(v => v.voiceURI === state.selectedVoiceURI);
                                if (voice) utterance.voice = voice;
                            }
                            
                            utterance.rate = 1.1; // Slightly faster for quick scanning
                            utterance.volume = 0.8;
                            
                            // iOS fix: Small delay before speaking
                            setTimeout(() => {
                                window.speechSynthesis.speak(utterance);
                            }, 10);
                        }
                    }
                } else {
                    b.style.removeProperty('--scan-color');
                    b.style.removeProperty('--scan-glow');
                }
            });
        }

        // Brief mechanical-click sound played each time the scan selection advances.
        // Built from a noise burst with fast exponential decay — no audio files needed.
        function playScanTick() {
            try {
                const ctx = initAudioCtx();
                if (!ctx || ctx.state !== 'running') return;
                const dur = 0.018; // seconds
                const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.004));
                }
                const src = ctx.createBufferSource();
                src.buffer = buf;
                const g = ctx.createGain();
                g.gain.value = 0.35;
                src.connect(g);
                g.connect(ctx.destination);
                src.start();
            } catch(e) {}
        }

        // --- AUTO GRID LAYOUT ---
        // Positions and scales buttons to fit the current orientation cleanly.
        // Landscape = side-by-side rows; Portrait = stacked columns.
        function arrangeGrid() {
            const n = state.buttons.length;
            const land = window.innerWidth > window.innerHeight;

            // [x%, y%] canvas positions and recommended scale per layout
            let positions, scale;
            if (n === 1) {
                positions = [[50, 50]];
                scale = 1.0;
            } else if (n === 2) {
                // Landscape: left/right halves  |  Portrait: top/bottom halves
                positions = land
                    ? [[26, 50], [74, 50]]
                    : [[50, 28], [50, 72]];
                scale = 0.9;
            } else if (n === 3) {
                // Landscape: evenly spaced row  |  Portrait: 2-up + 1 centered below
                positions = land
                    ? [[17, 50], [50, 50], [83, 50]]
                    : [[30, 26], [70, 26], [50, 74]];
                scale = land ? 0.70 : 0.82;
            } else {
                // 4 buttons: 2×2 grid always fits both orientations
                positions = [[27, 26], [73, 26], [27, 74], [73, 74]];
                scale = 0.78;
            }

            positions.forEach((p, i) => {
                if (state.buttons[i]) {
                    state.buttons[i].pos   = { x: p[0], y: p[1] };
                    state.buttons[i].scale = scale;
                }
            });
            saveState();
            renderButtons();
        }

        // ADDED: KEYBOARD SUPPORT
        window.addEventListener('keydown', (e) => {
            if (state.showSettings || state.isPositioningMode) return;
            if (state.activationMode === 'scan') {
                if (['Space', 'Enter', 'Digit1', 'Digit2', 'Digit3', 'Digit4'].includes(e.code)) {
                    e.preventDefault();
                    const btn = state.buttons[scanIdx];
                    if (btn) activateSwitch(btn.id);
                }
                return;
            }
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                if (state.buttons.length > 0) activateSwitch(state.buttons[0].id);
            }
            if (['Digit1', 'Digit2', 'Digit3', 'Digit4'].includes(e.code)) {
                const idx = parseInt(e.code.slice(-1)) - 1;
                if (state.buttons[idx]) activateSwitch(state.buttons[idx].id);
            }
        });

        // --- PWA: INSTALL PROMPT ---
        let deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
            // Re-render system tab if open so the install button appears
            if (state.showSettings && state.settingsTab === 'system') renderSettingsContent();
        });
        window.addEventListener('appinstalled', () => {
            deferredInstallPrompt = null;
            if (state.showSettings && state.settingsTab === 'system') renderSettingsContent();
        });

        // --- SERVICE WORKER REGISTRATION ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => { /* SW unavailable – file:// or blocked */ });
            });
        }

    </script>
</body>
